name: Android release
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    environment: android-release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release metadata
        id: release
        run: node scripts/release-metadata.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run cap:sync
      - name: Decode persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing signing secret: $name" >&2; exit 1; }
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pos-offline.jks"
          keytool -list -keystore "$RUNNER_TEMP/pos-offline.jks" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null
      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pos-offline.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_CODE: ${{ steps.release.outputs.code }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease -PreleaseVersionName="$RELEASE_VERSION" -PreleaseVersionCode="$RELEASE_CODE"
      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/pos-offline.jks"
      - name: Verify and prepare artifacts
        run: |
          set -eu
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify android/app/build/outputs/apk/release/app-release.apk
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/pos-offline-$GITHUB_REF_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/pos-offline-$GITHUB_REF_NAME.aab"
          cd release-artifacts
          sha256sum ./*.apk ./*.aab > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
